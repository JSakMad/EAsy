services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: easy_a_finder
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - easy_a_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d easy_a_finder"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  easy_a_postgres:
